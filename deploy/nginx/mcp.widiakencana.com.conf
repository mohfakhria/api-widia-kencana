# Gerbang MCP — pintu bagi AI agent menyunting dokumen.
#
#   ln -s /etc/nginx/sites-available/mcp.widiakencana.com.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mcp.widiakencana.com
#
# certbot menyisipkan sendiri baris ssl_certificate beserta pengalihan ke https,
# jadi berkas ini sengaja hanya berisi blok :80.
#
# PERIKSA PORTNYA. 9090 adalah bawaan MCP_PORT. Yang salah menghasilkan 502,
# bukan galat yang menyebut portnya.
#
# ── Yang membuat host ini berbeda dari vhost lain di repo ini ──────────────
#
# Proses di baliknya memegang SANDI AGENT. Siapa pun yang menjangkaunya dan
# melewati penjaganya adalah agent — dan agent boleh membuat, mengubah, serta
# MENGHAPUS dokumen dan aset. Ini satu-satunya host di sini yang, bila jebol,
# memberi penyerang kemampuan mengubah isi pekerjaan orang.
#
# Penjaga utamanya ada di aplikasi: MCP_AUTH_TOKEN, dibandingkan waktu-tetap,
# dan MCP menolak berdiri tanpanya. Yang di bawah ini lapisan kedua.

server {
	listen 80;
	server_name mcp.widiakencana.com;

	# Muatan MCP berupa JSON berisi elemen dokumen — satu perintah dapat membawa
	# puluhan elemen sekaligus. Bawaan nginx satu megabyte cukup untuk itu, tetapi
	# batasnya dinaikkan sedikit supaya perintah besar tidak ditolak 413 di tengah
	# pekerjaan. TIDAK dibuat nol seperti vhost storage: di sana yang lewat adalah
	# berkas, di sini yang lewat perintah, dan perintah sebesar itu selalu keliru.
	client_max_body_size 8m;

	location / {
		# Pembatasan alamat. Dibiarkan sebagai komentar, bukan dihapus, supaya
		# terlihat oleh siapa pun yang membaca berkas ini bahwa keputusannya ada
		# dan belum diambil.
		#
		# Jauh lebih kuat daripada token bila pemanggilnya memang sedikit dan
		# alamatnya tetap — token bocor tetap dapat dipakai dari mana saja,
		# sedangkan alamat tidak. Sering tidak praktis karena klien MCP kerap
		# berjalan di laptop dengan alamat yang berganti-ganti; kalau begitu
		# keadaannya, biarkan tertutup dan andalkan tokennya.
		#
		# allow 203.0.113.4;
		# deny all;

		proxy_pass http://127.0.0.1:9090;
		proxy_http_version 1.1;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WAJIB dimatikan, dan ini yang paling mudah terlewat.
		#
		# Protokol MCP jarak jauh mengalirkan balasannya — SSE pada transport
		# lama, respons chunked pada Streamable HTTP. Dengan penyangga menyala,
		# nginx MENAHAN potongan-potongan itu sampai penuh atau sampai koneksinya
		# ditutup, sehingga klien tidak menerima apa pun selama agent bekerja lalu
		# menerima semuanya sekaligus di akhir.
		#
		# Gejalanya bukan galat melainkan kelambatan yang tampak seperti agent
		# yang menggantung — dan itu justru pada pekerjaan panjang, tempat aliran
		# balasan paling dibutuhkan.
		#
		# Belum berpengaruh hari ini, karena MCP masih membalas JSON biasa. Disetel
		# sekarang supaya ia sudah benar ketika protokolnya masuk, bukan menjadi
		# sesuatu yang harus ditemukan lewat gejala.
		proxy_buffering off;
		proxy_cache off;

		# Satu perintah agent dapat berjalan lama: LLM berpikir, lalu puluhan
		# suntingan mengalir ke socket dokumen. Bawaan enam puluh detik akan
		# memutusnya di tengah, dan yang terputus menyisakan dokumen setengah jadi
		# tanpa ada yang tahu bagian mana yang belum sempat.
		proxy_connect_timeout 30s;
		proxy_send_timeout 600s;
		proxy_read_timeout 600s;
	}
}

# CATATAN: MCP TIDAK melayani API maupun WebSocket penyuntingan.
#
# Ia klien keduanya, dan menghubunginya lewat loopback — API_BASE_URL menunjuk
# 127.0.0.1, tidak melewati nginx sama sekali. Jadi host ini tidak perlu, dan
# tidak boleh, meneruskan apa pun ke :8080.
#
# Konsekuensinya untuk pemecahan masalah: MCP yang tidak dapat menghubungi API
# adalah persoalan di dalam server, bukan di nginx. Periksa unit systemd-nya dan
# API_BASE_URL, bukan berkas ini.
