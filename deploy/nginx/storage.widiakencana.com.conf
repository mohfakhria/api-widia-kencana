# Konsol web MinIO — antarmuka untuk manusia, bukan untuk aplikasi.
#
#   ln -s /etc/nginx/sites-available/storage.widiakencana.com.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d storage.widiakencana.com
#
# certbot menyisipkan sendiri baris ssl_certificate beserta pengalihan ke https,
# jadi berkas ini sengaja hanya berisi blok :80.
#
# PERIKSA PORTNYA. 9001 adalah bawaan MinIO untuk konsol, dan ia HARUS dipatok
# lewat --console-address saat MinIO dijalankan. Tanpa patokan itu MinIO memilih
# port acak setiap kali start, dan vhost ini akan menunjuk ke port yang sudah
# tidak melayani apa pun setelah restart pertama.
#
# ── Peringatan yang perlu dibaca sebelum host ini dinyalakan ────────────────
#
# Aplikasi ini memakai KREDENSIAL ROOT MinIO. Konsol yang terbuka ke internet
# berarti satu formulir login yang, bila ditembus, memberikan kuasa penuh atas
# seluruh bucket — termasuk menghapusnya. Dua hal yang layak dikerjakan lebih
# dulu:
#
#   1. Ganti kredensial aplikasi dengan user MinIO terbatas yang hanya boleh
#      membaca dan menulis pada bucket-nya sendiri, lalu simpan kredensial root
#      untuk konsol saja.
#   2. Batasi host ini pada alamat yang dikenal — lihat blok allow/deny di
#      bawah, yang sengaja ditinggalkan sebagai komentar agar keputusannya
#      diambil sadar, bukan terlewat.

# Konteks http, bukan server. Bila vhost lain juga mendefinisikan map dengan
# nama ini — socket-design.widiakencana.com.conf salah satunya — nginx MENOLAK
# start karena nama yang sama tidak boleh didefinisikan dua kali. Pindahkan ke
# satu berkas bersama bila keduanya perlu aktif bersamaan.
map $http_upgrade $connection_upgrade_console {
	default upgrade;
	''      close;
}

server {
	listen 80;
	server_name storage.widiakencana.com;

	# Konsol mengunggah dan mengunduh objek lewat dirinya sendiri, jadi batas
	# bawaan satu megabyte akan menolak berkas nyata dengan 413.
	client_max_body_size 0;

	location / {
		# Pembatasan alamat. Dibiarkan sebagai komentar, bukan dihapus, supaya
		# terlihat oleh siapa pun yang membaca berkas ini bahwa keputusannya ada
		# dan belum diambil.
		#
		# allow 203.0.113.4;
		# deny all;

		proxy_pass http://127.0.0.1:9001;
		proxy_http_version 1.1;

		# Konsol memakai WebSocket untuk pembaruan langsung. Tanpa kedua baris
		# upgrade ini ia tetap terbuka tetapi tidak pernah menyegarkan isinya,
		# dan itu terlihat seperti konsol yang menggantung.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade_console;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}
}

# CATATAN: S3 API TIDAK dilayani host ini — ia ada di
# api-storage.widiakencana.com.conf. Presigned URL yang menunjuk ke sini akan
# gagal, karena konsol bukan endpoint S3 dan tidak mengenal tanda tangannya.
