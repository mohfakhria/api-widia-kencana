# Gerbang :8080 — SATU nama untuk seluruh yang dilayani proses API.
#
#   ln -s /etc/nginx/sites-available/gateway.widiakencana.com.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d gateway.widiakencana.com
#
#
# URUTANNYA MENGIKAT, dan ini jebakan yang mahal bila terlewat. certbot --nginx
# hanya melihat konfigurasi yang BENAR-BENAR TERMUAT nginx; berkas yang duduk di
# sites-available tanpa symlink tidak terlihat olehnya sama sekali.
#
# Dijalankan sebelum symlink ada, certbot tidak menemukan blok server untuk nama
# ini — lalu, alih-alih berhenti, ia MENYALIN blok default yang kebetulan ia
# temukan dan menempelkan sertifikat ke sana. Bila yang ia temukan blok penolak
# bawaan yang memuat ssl_reject_handshake, hasilnya bukan sekadar salah tempat
# melainkan blok yang tugasnya MENOLAK nama ini — dan :80 sudah terlanjur
# dialihkan ke :443, sehingga host menjadi tidak terjangkau dari mana pun.
#
# Sudah terjadi pada mcp.widiakencana.com, 2026-08-12.
#
# certbot menyisipkan sendiri baris ssl_certificate beserta pengalihan ke https,
# jadi berkas ini sengaja hanya berisi blok :80.
#
# PERIKSA PORTNYA. 8080 adalah bawaan APP_PORT. Port yang salah menghasilkan 502,
# galat yang tidak pernah menyebut portnya.
#
# ── Host ini menggantikan socket-design.widiakencana.com ───────────────────
#
# REST API dan WebSocket penyuntingan dilayani PROSES YANG SAMA di :8080, dan
# dulu dipecah menjadi dua nama. Sekarang keduanya di sini, dan socket-design
# menyusul dihapus.
#
# Urutan berpindah yang aman:
#
#   1. Nyalakan host ini, terbitkan sertifikatnya.
#   2. Arahkan frontend ke wss://gateway.widiakencana.com/document-design/<token>.
#   3. Setelah tidak ada lagi yang menyambung ke nama lama, baru lepas symlink
#      socket-design dan reload.
#
# Langkah 1 dan 3 sengaja berjauhan, dan berkas ini disusun supaya keduanya boleh
# HIDUP BERSAMAAN selama masa itu — lihat nama map di bawah. Tanpa itu, berpindah
# menuntut kedua langkah terjadi dalam satu tarikan napas, dan di antaranya ada
# jendela waktu ketika penyuntingan mati.
#
# ── Yang membuat host ini berbeda dari vhost lain di repo ini ──────────────
#
# Ia satu-satunya yang membawa MUATAN UNGGAHAN dari aplikasi sendiri.
#
# Aset gambar TIDAK lewat sini: /api/asset-upload-request menerbitkan presigned
# URL yang menunjuk api-storage, dan berkasnya berjalan langsung dari peramban
# ke MinIO. Karena itu vhost ini tidak perlu menampung gambar berukuran apa pun.
#
# Yang lewat sini justru satu-satunya pengecualian: /api/font-add, unggahan arsip
# ZIP berisi berkas font. Batasnya ada di aplikasi, 20 MiB, dan lihat catatan
# pada client_max_body_size di bawah — bawaan nginx satu megabyte akan menolaknya
# jauh sebelum aplikasi sempat berpendapat.

# Konteks http, bukan server. Namanya BERAKHIRAN _gateway, dan itu bukan gaya
# penamaan melainkan syarat: socket-design.widiakencana.com.conf mendefinisikan
# $connection_upgrade, dan nginx MENOLAK MUAT bila satu nama didefinisikan dua
# kali. Dengan nama tersendiri, kedua vhost boleh aktif berdampingan selama masa
# perpindahan — dan nginx -t tidak gagal tepat pada saat yang paling genting.
#
# Cara yang sama sudah dipakai storage.widiakencana.com.conf dengan
# $connection_upgrade_console; ini bukan penyelesaian baru, melainkan mengikuti
# yang sudah ada di sini.
#
# Setelah socket-design benar-benar hilang, akhiran ini boleh ditanggalkan —
# suntingan sebaris, di dua tempat pada berkas ini saja.
#
# Nilainya harus "upgrade" HANYA ketika klien memang meminta upgrade. Meneruskan
# header Connection apa adanya membuat handshake gagal pada permintaan yang
# datang lewat koneksi keep-alive biasa.
map $http_upgrade $connection_upgrade_gateway {
	default upgrade;
	''      close;
}

server {
	listen 80;
	server_name gateway.widiakencana.com;

	# Sedikit DI ATAS batas aplikasi, dan selisihnya disengaja.
	#
	# maxFontArchiveBytes di font_handler.go adalah 20 MiB. Kalau nginx dipatok
	# pada angka yang sama persis, arsip yang mepet ditolak oleh nginx — dengan
	# halaman HTML "413 Request Entity Too Large" yang tidak menyebut batasnya
	# dan tidak berbentuk JSON seperti seluruh galat API lainnya.
	#
	# Dilonggarkan satu megabyte, penolakannya selalu datang dari aplikasi:
	# {"status":"error","message":"archive is larger than 20971520 bytes"} —
	# pesan yang menyebut angkanya, dan yang klien sudah tahu cara membacanya.
	#
	# Jangan dibuat 0 seperti vhost storage. Di sana yang lewat memang berkas
	# tanpa batas; di sini muatan sebesar itu hanya lahir dari kekeliruan.
	#
	# Tidak berlaku bagi WebSocket: bingkai socket bukan badan permintaan, dan
	# batas pesannya ditegakkan aplikasi — designMaxMessageBytes, 1 MiB.
	client_max_body_size 21m;

	# WebSocket penyuntingan. Lebih spesifik daripada location / di bawahnya,
	# jadi nginx memilih blok ini — awalan terpanjang yang cocok yang menang.
	location /document-design/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;

		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade_gateway;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Server mengirim ping tiap 30 detik, jadi koneksi yang sehat tidak
		# pernah sunyi selama itu. Enam puluh detik bawaan nginx terlalu ketat
		# bila ada satu denyut yang tersendat, dan gejalanya di editor terlihat
		# seperti jaringan putus berkala tanpa sebab.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;

		# Penyuntingan realtime tidak boleh ditahan di penyangga nginx. Kursor
		# dan perubahan elemen datang puluhan kali per detik, dan gunanya justru
		# pada ketepatan waktunya.
		proxy_buffering off;
	}

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Ekspor PDF adalah permintaan terpanjang di API ini: isi dokumen dibaca,
		# gambar DAN font diunduh dari object storage, lalu seluruh halaman
		# digambar. Enam puluh detik bawaan nginx cukup untuk dokumen yang wajar,
		# tetapi yang melewatinya akan terputus sebagai 504 — dan yang terlihat
		# pengguna adalah tombol ekspor yang gagal tanpa sebab, sementara di log
		# aplikasi ekspornya justru selesai dengan sukses beberapa detik kemudian.
		proxy_connect_timeout 15s;
		proxy_send_timeout 120s;
		proxy_read_timeout 120s;
	}
}

# CATATAN: header Origin sengaja TIDAK disetel di mana pun di atas.
#
# Handshake menolak Origin yang tidak cocok dengan ALLOWED_ORIGINS, dan yang
# diperiksa harus origin ASLI dari browser. Menambahkan proxy_set_header Origin
# berarti setiap klien lolos pemeriksaan itu, termasuk yang datang dari situs
# orang lain — dan bentuknya persis seperti "perbaikan" yang orang lakukan ketika
# handshake-nya ditolak 403.
#
# CATATAN: /api/font-content/:family/:face mengalihkan (302) ke api-storage.
#
# Peramban mengambil berkas font SELALU dalam mode CORS. Yang harus mengizinkan
# adalah host tujuan pengalihannya — MinIO di balik api-storage — bukan berkas
# ini. Menambahkan add_header Access-Control-Allow-Origin di sini tidak akan
# memperbaiki apa pun, karena permintaan yang gagal bukan yang mendarat di sini
# melainkan yang mendarat di sana.
#
# CATATAN: CORS jalur biasa diurus aplikasi lewat ALLOWED_ORIGINS.
#
# Jangan menambahkan add_header Access-Control-Allow-Origin di vhost ini. Aplikasi
# sudah mengirimkannya beserta header Vary yang benar, dan yang kedua justru
# merusak: dua Access-Control-Allow-Origin dalam satu respons ditolak peramban
# sebagai tidak sah, sehingga "menambahkan CORS" menghasilkan CORS yang mati.
#
# CATATAN: /health terbuka tanpa penjaga, dan itu memang bawaannya.
#
# Yang disebutkannya hanya APP_ENV. Berguna sebagai sasaran monitor dari luar;
# bila suatu saat dianggap terlalu banyak bercerita, tutup dengan blok location
# tersendiri di sini — bukan dengan mengubah aplikasi, karena unit systemd dan
# pemeriksa lokal memanggilnya lewat 127.0.0.1 dan tidak melewati nginx.
