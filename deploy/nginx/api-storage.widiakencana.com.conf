# S3 API MinIO — tempat presigned URL mendarat.
#
#   ln -s /etc/nginx/sites-available/api-storage.widiakencana.com.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api-storage.widiakencana.com
#
# certbot menyisipkan sendiri baris ssl_certificate beserta pengalihan ke https,
# jadi berkas ini sengaja hanya berisi blok :80.
#
# PERIKSA PORTNYA. 9000 adalah bawaan MinIO untuk S3 API; pemasangan di mesin
# pengembang repo ini memakai 9002. Yang salah di sini menghasilkan 502, bukan
# galat yang menyebut portnya.
#
# ── Yang WAJIB sejalan dengan aplikasi ──────────────────────────────────────
#
# Presigned URL ditandatangani untuk host yang tertulis di MINIO_ENDPOINT, dan
# MinIO memvalidasinya terhadap header Host yang ia terima. Ketiganya harus
# menyebut nama yang sama:
#
#   MINIO_ENDPOINT=api-storage.widiakencana.com   (TANPA skema, tanpa port)
#   MINIO_USE_SSL=true                            (setelah certbot dijalankan)
#   proxy_set_header Host $host;                  (di bawah)
#
# Melenceng satu saja menghasilkan SignatureDoesNotMatch dari MinIO — galat yang
# tidak menyebut host sama sekali, dan karenanya paling sering disalahartikan
# sebagai kredensial yang keliru.

server {
	listen 80;
	server_name api-storage.widiakencana.com;

	# Unggahan berjalan LANGSUNG dari browser ke sini, tidak melewati API Go.
	# Batas bawaan nginx satu megabyte akan menolak hampir setiap berkas nyata
	# dengan 413, dan gejalanya di editor tampak seperti unggahan yang gagal
	# tanpa sebab. Nol berarti tanpa batas; MinIO sendiri yang membatasi.
	client_max_body_size 0;

	location / {
		proxy_pass http://127.0.0.1:9000;
		proxy_http_version 1.1;

		# $host, BUKAN $proxy_host. Inilah baris yang menentukan tanda tangan
		# presigned cocok atau tidak: MinIO menghitung ulang tanda tangannya
		# memakai Host yang ia terima, sedangkan yang ditandatangani adalah nama
		# publik di atas. $proxy_host akan mengirim "127.0.0.1:9000" dan setiap
		# unggahan ditolak SignatureDoesNotMatch.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Badan permintaan diteruskan mengalir, tidak ditampung lebih dulu.
		# Tanpa ini nginx menulis seluruh berkas ke disk sebelum satu byte pun
		# sampai ke MinIO — memperlambat unggahan besar dan memenuhi /var/cache.
		proxy_request_buffering off;
		proxy_buffering off;

		# Unggahan besar pada jaringan lambat dapat melampaui bawaan 60 detik,
		# dan yang putus di tengah menyisakan objek yang tidak pernah lengkap.
		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}
}

# CATATAN: konsol MinIO TIDAK dilayani host ini. Ia punya vhost sendiri di
# storage.widiakencana.com.conf, dan memisahkannya disengaja — satu nama yang
# melayani keduanya berarti konsol ikut terbuka bagi siapa pun yang menemukan
# host ini dari presigned URL yang bocor.
